{% extends "base.html" %}
{% block content %}

<!-- login card kept narrow so the form stays centred and tidy -->
<div class="card" style="max-width:420px; margin:40px auto;">

  <!-- page heading -->
  <h2 style="text-align:center;">Login</h2>

  <!-- login form -->
  <form method="post" class="form" autocomplete="off">

    <!-- CSRF protection token for form security -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      required
      autocomplete="username"
      placeholder="Enter username"
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      autocomplete="current-password"
      placeholder="Enter password"
    >

    <!-- submit button to log the user in -->
    <button type="submit">Login</button>

  </form>

  <!-- small link for users who do not have an account yet -->
  <p class="muted" style="margin-top:14px; text-align:center;">
    No account yet?
    <a href="{{ url_for('register') }}">Register</a>
  </p>

</div>

{% endblock %}
